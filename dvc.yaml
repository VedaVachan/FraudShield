stages:
  spark_prepare:
    cmd: env PYTHONPATH=src .venv/bin/python scripts/prepare_spark_dvc.py
    deps:
      - data/raw/paysim.csv
      - scripts/prepare_spark.py
      - scripts/prepare_spark_dvc.py
      - src/fraudshield/features.py
      - src/fraudshield/spark_features.py
      - requirements-ml.lock.txt
      - requirements-spark.txt
    outs:
      - data/processed/paysim_spark_dvc_v1

  logreg_train:
    cmd: env PYTHONPATH=src .venv/bin/python scripts/train_logreg_dvc.py
    deps:
      - data/processed/paysim_spark_dvc_v1
      - scripts/train_logreg.py
      - scripts/train_logreg_dvc.py
      - src/fraudshield/features.py
      - requirements-ml.lock.txt
    outs:
      - artifacts/logreg_dvc_v1

  xgboost_train:
    cmd: env PYTHONPATH=src .venv/bin/python scripts/train_xgboost_dvc.py
    deps:
      - data/processed/paysim_spark_dvc_v1
      - scripts/train_xgboost.py
      - scripts/train_xgboost_dvc.py
      - scripts/train_logreg.py
      - scripts/train_logreg_dvc.py
      - src/fraudshield/features.py
      - requirements-ml.lock.txt
    outs:
      - artifacts/xgboost_dvc_v1

  xgboost_validation_gate:
    cmd: .venv/bin/python scripts/run_model_gate.py > reports/xgboost_validation_gate.json
    deps:
      - artifacts/xgboost_dvc_v1
      - scripts/check_model_gate.py
      - scripts/run_model_gate.py
    outs:
      - reports/xgboost_validation_gate.json:
          cache: false
