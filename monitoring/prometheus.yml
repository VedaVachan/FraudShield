global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
scrape_configs:
- job_name: fraudshield-api
  metrics_path: /metrics
  static_configs:
  - targets:
    - api:8000
- job_name: fraudshield-gateway
  metrics_path: /metrics
  static_configs:
  - targets:
    - fraudshield-canary-gateway:8010
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: fraudshield-node
  scrape_interval: 30s
  static_configs:
  - targets:
    - fraudshield-node-exporter:9100
- job_name: fraudshield-containers
  scrape_interval: 30s
  static_configs:
  - targets:
    - fraudshield-cadvisor:8080
rule_files:
- /etc/prometheus/drift_rules.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - fraudshield-alertmanager:9093
